[workspace]
resolver = "3"
members = ["crates/esteban-core", "crates/esteban-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/SunqdXX/esteban-launcher"
publish = false

[workspace.dependencies]
esteban-core = { path = "crates/esteban-core" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wiremock = "0.6"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
